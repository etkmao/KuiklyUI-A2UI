name: A2UICardShowcaseApp
options:
  bundleIdPrefix: com.tencent.kuikly.a2ui.showcase
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  A2UICardShowcaseApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tencent.kuikly.a2ui.showcase.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchScreen.storyboard
